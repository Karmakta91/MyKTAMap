<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Rose des vents MyKTAMap">
  <!-- Rose des vents vectorielle MyKTAMap — v1.47.0 (KARMA).
