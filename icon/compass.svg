    <g transform="rotate(247.5 100 100)"><line x1="100" y1="6" x2="100" y2="15"/></g>
    <g transform="rotate(292.5 100 100)"><line x1="100" y1="6" x2="100" y2="15"/></g>
    <g transform="rotate(337.5 100 100)"><line x1="100" y1="6" x2="100" y2="15"/></g>
