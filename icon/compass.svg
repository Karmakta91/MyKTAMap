  <g transform="rotate(225 100 100)"><polygon points="100,52 104,89 100,100" fill="#8cb4ff"/><polygon points="100,52 96,89 100,100" fill="#5b7fc0"/></g>
  <g transform="rotate(315 100 100)"><polygon points="100,52 104,89 100,100" fill="#8cb4ff"/><polygon points="100,52 96,89 100,100" fill="#5b7fc0"/></g>
