# Sonde d'intégrité (11/10/2026) : le code SERVI par myktamap.fr et dev.myktamap.fr est-il celui du dépôt ?
# Après un piratage du serveur, le risque est une page modifiée en place (le chiffrement protège ce qui est stocké,
# pas le code servi). Lancée d'ici, HORS du serveur, toutes les heures : un écart fait échouer le run, et GitHub
# prévient par e-mail. Détails et limites : scripts/release/sonde-integrite.js.
name: Sonde d'intégrité

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        site: ["https://myktamap.fr", "https://dev.myktamap.fr"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Code servi = dépôt
        run: node scripts/release/sonde-integrite.js "${{ matrix.site }}"
