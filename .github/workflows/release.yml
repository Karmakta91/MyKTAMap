# =====================================================================
# MyKTAMap — Workflow de release automatique
# =====================================================================
# Quand `version.json > version` change sur main (= bump de version),
# ce workflow auto-crée :
#   1. Un tag git `v<version>` (ex: v168) sur le commit du bump
#   2. Une GitHub Release avec les notes user-facing extraites de version.json
#
# AVANTAGE
# - La page "Releases" du repo devient l'index visible chronologique des
#   versions, avec leur changelog formaté
# - Aucun changement de workflow côté dev : tu continues de bumper les
#   3 fichiers (sw.js, copyright.js, version.json) comme avant, le tag
#   + la release apparaissent automatiquement après le push sur main
# - Le tag te permet de checkout le code exact d'une version donnée
#
# INITIALISATION (à faire une seule fois après le merge de ce workflow)
# La version courante v168 n'a pas encore de tag/release associé. Pour
# antidater proprement, lance dans un terminal :
#
#   git tag v168 cb5e05d
#   git push origin v168
#   gh release create v168 \
#     --title "MyKTAMap v168" \
#     --notes-file - <<EOF
#   ## 📋 Nouveautés
#
#   - 🏗️ Mode multi-niveau (carrières multi-étages)…
#   - 🧱 Mode V2 (plan tuilé)…
#   - 🧭 Boussole / widget Nord…
#
#   ---
#   _Publié le 2026-05-15_
#   EOF
#
# Le prochain bump (v169) déclenchera automatiquement ce workflow.
# =====================================================================

name: Auto Release

on:
  push:
    branches: [main]
    # Optimisation : le workflow ne se déclenche QUE si version.json a été
    # modifié dans le push (= très majoritairement les commits de bump).
    paths:
      - 'version.json'
  # Trigger manuel via UI GitHub Actions → "Run workflow" sur la branche main.
  # Utile pour :
  #   - Retry après un échec (le workflow check si la release existe déjà → skip
  #     auto si oui, donc safe à relancer plusieurs fois)
  #   - Créer une release pour une version déjà bumpée mais dont le workflow
  #     auto n'a pas tourné (ex: bug temporaire, version.json modifié hors push)
  workflow_dispatch:

# Le workflow doit pouvoir créer tags + releases
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (avec historique pour diff)
        uses: actions/checkout@v5
        with:
          fetch-depth: 2  # On compare HEAD vs HEAD~1

      # ----------------------------------------------------------------
      # 1. Lecture version courante (HEAD) et précédente (HEAD~1)
      # ----------------------------------------------------------------
      - name: Lire version courante
        id: current
        run: |
          VERSION=$(jq -r '.version' version.json)
          RELEASED=$(jq -r '.released' version.json)
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "released=$RELEASED" >> "$GITHUB_OUTPUT"
          echo "[release] Version courante : $VERSION ($RELEASED)"

      - name: Lire version précédente (HEAD~1)
        id: previous
        run: |
          # git show peut échouer si version.json n'existait pas avant (1er commit) -
          # dans ce cas on traite comme "version différente" pour déclencher la release.
          PREV=$(git show HEAD~1:version.json 2>/dev/null | jq -r '.version' 2>/dev/null || echo "")
          echo "version=$PREV" >> "$GITHUB_OUTPUT"
          echo "[release] Version précédente : ${PREV:-<aucune>}"

      # ----------------------------------------------------------------
      # 2. Check unique et robuste : la release existe-t-elle déjà ?
      # ----------------------------------------------------------------
      # ⚠️ HISTORIQUE — fix v1.7.3 :
      # Avant, on avait 2 checks séparés :
      #   - "Vérifier que la version a changé" (HEAD vs HEAD~1)
      #   - "Vérifier que le tag n'existe pas déjà"
      # Problème : si le workflow a échoué pour une raison X au premier push
      # du bump, un commit de fix qui ne re-bump pas la version va re-trigger
      # le workflow MAIS le 1er check va voir "version inchangée → skip" →
      # impossible de récupérer la release manquante sans rebumper la version.
      # Solution : un seul check basé sur l'existence de la release. Si elle
      # n'existe pas pour la version courante → on tente de la créer. Plus
      # robuste pour les cas de retry.
      - name: Vérifier que la release n'existe pas déjà
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "[release] La release $VERSION existe déjà → skip"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "[release] Release $VERSION pas encore créée → on continue"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Step legacy renommée pour compat avec les `if:` plus bas qui
      # référencent `steps.tag_check.outputs.skip`. On expose la même valeur
      # que `check` (== unique source de vérité maintenant).
      - name: Alias tag_check pour compat
        id: tag_check
        run: |
          echo "skip=${{ steps.check.outputs.skip }}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------------------
      # 4. Formate les release notes dans un FICHIER (pas un string shell)
      # ----------------------------------------------------------------
      # ⚠️ HISTORIQUE — bug v1.7.3 (19/05/2026) :
      # Avant, on injectait les notes via `--notes "${{ steps.notes.outputs.body }}"`
      # ce qui marchait pour des notes simples, mais cassait dès qu'une note
      # contenait un guillemet double (ex: tagline "Cartographie souterraine").
      # Le shell fermait prématurément le string → exit code 1 sur la commande
      # `gh release create`. Solution : écrire les notes dans un fichier markdown
      # temporaire et utiliser `--notes-file`. Le contenu n'est plus interprété
      # par le shell, donc robuste aux guillemets, backticks, $(), etc.
      - name: Formater les release notes dans un fichier
        id: notes
        if: steps.check.outputs.skip == 'false' && steps.tag_check.outputs.skip == 'false'
        run: |
          # Convertit le array `notes` JSON en bullets markdown.
          NOTES=$(jq -r '.notes // [] | map("- " + .) | join("\n")' version.json)
          PREV="${{ steps.previous.outputs.version }}"
          CUR="${{ steps.current.outputs.version }}"
          RELEASED="${{ steps.current.outputs.released }}"

          # Lien compare entre tag précédent et nouveau, si tag précédent existe.
          # ⚠️ Single-line avec $'\n\n' (ANSI-C quoting) : une ligne vide à
          # indentation 0 dans un block scalar `|` ferme le scalar côté YAML
          # parser. On évite ça en mettant les \n en bash plutôt qu'en YAML.
          COMPARE_LINK=""
          if [ -n "$PREV" ] && [ "$PREV" != "null" ]; then
            REPO="${{ github.repository }}"
            COMPARE_LINK=$'\n\n[📊 Voir tous les commits depuis '"$PREV"$'](https://github.com/'"$REPO"$'/compare/'"$PREV"$'...'"$CUR"$')'
          fi

          # Écriture dans un fichier temporaire — pas d'interprétation shell
          # sur le contenu, robuste aux caractères spéciaux (", `, $(), etc.).
          NOTES_FILE="${{ runner.temp }}/release-notes.md"
          {
            echo "## 📋 Nouveautés"
            echo ""
            echo "$NOTES"
            echo ""
            echo "---"
            echo "_Publié le ${RELEASED}_"
            echo "$COMPARE_LINK"
          } > "$NOTES_FILE"

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "[release] Notes écrites dans $NOTES_FILE :"
          echo "----------------------------------------"
          cat "$NOTES_FILE"
          echo "----------------------------------------"

      # ----------------------------------------------------------------
      # 5. Crée le tag + la release GitHub via --notes-file (robuste)
      # ----------------------------------------------------------------
      - name: Créer le tag et la release
        if: steps.check.outputs.skip == 'false' && steps.tag_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          # Le tag est créé directement par `gh release create --target` sur le
          # commit courant (HEAD = commit du bump version.json sur main).
          # `--latest` marque cette release comme la dernière (utile pour le badge
          # "Latest" sur la page GitHub).
          # `--notes-file` lit depuis un fichier markdown → aucune interprétation
          # shell sur le contenu (cf. fix v1.7.3 du bug guillemets internes).
          gh release create "$VERSION" \
            --title "MyKTAMap $VERSION" \
            --notes-file "${{ steps.notes.outputs.notes_file }}" \
            --target main \
            --latest
          echo "[release] ✅ Release $VERSION créée avec succès"

      # ----------------------------------------------------------------
      # 6. Construit un package ZIP autonome (selfhosting)
      # ----------------------------------------------------------------
      # Le PWA est 100 % statique → un user peut déposer le contenu du ZIP
      # sur n'importe quel serveur web (Nginx, Apache, Caddy, http-server)
      # et c'est utilisable immédiatement, sans build.
      #
      # Stratégie : on copie le repo dans un dossier `MyKTAMap-<version>/`
      # via rsync avec exclusions explicites (= plus lisible qu'un .gitignore
      # complexe et indépendant des règles git). Puis on zippe.
      #
      # Le `--clobber` à l'upload écrase un éventuel asset déjà uploadé pour
      # cette version (cas d'un retry workflow_dispatch après échec).
      - name: Construire le package selfhost
        id: package
        if: steps.check.outputs.skip == 'false' && steps.tag_check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          PKG_NAME="MyKTAMap-${VERSION}"
          PKG_DIR="${{ runner.temp }}/${PKG_NAME}"

          mkdir -p "$PKG_DIR"

          # rsync avec exclusions :
          #  - .git, .github, .githooks, .gitignore       → git internals
          #  - .claude/                                    → Claude Code worktrees + sessions
          #  - CLAUDE.md                                   → instructions agent dev only
          #  - scripts/                                    → scripts dev local (check-no-pro-leak.js…)
          #  - Licence-pro.json                            → garde-fou (jamais en community mais au cas où)
          #  - .DS_Store, Thumbs.db                        → cosmétique OS
          #  - docs/ sauf docs/applications/, README.md   → doc interne (BACKLOG, audits, archi) : seul ce
          #    que l'app lit est livré — audit CD du 09/10/2026, mêmes règles que le Dockerfile et les
          #    scripts de déploiement (scripts/check-livrables-docs.js)
          rsync -a \
            --include='/docs/' \
            --include='/docs/applications/***' \
            --exclude='/docs/*' \
            --exclude='/README.md' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.githooks' \
            --exclude='.gitignore' \
            --exclude='.claude' \
            --exclude='.claude/**' \
            --exclude='CLAUDE.md' \
            --exclude='scripts/' \
            --exclude='Licence-pro.json' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            ./ "$PKG_DIR/"

          # Récap pour le log (visible dans le run UI GitHub Actions)
          echo "[package] Contenu du package $PKG_NAME :"
          (cd "$PKG_DIR" && find . -maxdepth 2 -type d | sort)
          echo "[package] Taille totale (avant zip) :"
          du -sh "$PKG_DIR" | awk '{print $1}'

          # ZIP final
          cd "${{ runner.temp }}"
          zip -rq "${PKG_NAME}.zip" "$PKG_NAME"

          PKG_PATH="${{ runner.temp }}/${PKG_NAME}.zip"
          PKG_SIZE=$(du -h "$PKG_PATH" | awk '{print $1}')

          echo "pkg_path=$PKG_PATH" >> "$GITHUB_OUTPUT"
          echo "pkg_name=${PKG_NAME}.zip" >> "$GITHUB_OUTPUT"
          echo "pkg_size=$PKG_SIZE" >> "$GITHUB_OUTPUT"
          echo "[package] ✅ ZIP créé : $PKG_PATH ($PKG_SIZE)"

      - name: Upload du package vers la release
        if: steps.check.outputs.skip == 'false' && steps.tag_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.current.outputs.version }}"
          PKG_PATH="${{ steps.package.outputs.pkg_path }}"
          PKG_NAME="${{ steps.package.outputs.pkg_name }}"
          PKG_SIZE="${{ steps.package.outputs.pkg_size }}"

          # --clobber : écrase un asset existant (utile pour les retry via
          # workflow_dispatch après échec du premier essai).
          gh release upload "$VERSION" "$PKG_PATH" --clobber

          echo "[release] ✅ Package uploadé : $PKG_NAME ($PKG_SIZE)"
          echo "[release] 🔗 Disponible sur : https://github.com/${{ github.repository }}/releases/tag/$VERSION"
