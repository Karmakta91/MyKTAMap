# =====================================================================
# MyKTAMap — CI (audit CI/CD du 08/10/2026, Q1)
# =====================================================================
# Les garde-fous (scripts/check-*.js) ne tournaient que dans les hooks LOCAUX : opt-in
# (core.hooksPath), contournables (--no-verify), absents de l'éditeur web de GitHub. Ce workflow
# les rejoue à chaque push et PR : syntaxe, contrôles des commits reçus (anti-fuite pro, data/
# hors Git) puis tous les garde-fous du pre-commit. Node pur, aucune installation.
# La protection de `main` (Settings › Branches) exige ce check avant tout merge.
# =====================================================================

name: CI

on:
  push:
    branches: [Karma_dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  garde-fous:
    name: Garde-fous
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # les commits du push, pour ci-commits.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Syntaxe
        run: |
          for f in js/*.js sw.js scripts/*.js scripts/smoke/*.js; do
            node --check "$f" || exit 1
          done

      - name: Commits reçus (anti-fuite pro, data/ hors Git)
        env:
          KTA_BASE: ${{ github.event.pull_request.base.sha }}
          KTA_AVANT: ${{ github.event.before }}
        run: sh scripts/ci-commits.sh

      - name: Garde-fous du pre-commit
        run: sh .githooks/pre-commit

  # Déploiement automatique (auto-deploy.sh sur le VPS, décision KARMA du 09/10/2026) : le VPS ne déploie
  # qu'un commit marqué VERT. Il lit la marque avec sa clé de déploiement (git ls-remote, lecture seule) :
  # aucun jeton GitHub sur le serveur. La marque est une référence hors branches et hors tags
  # (refs/ci/verte/<branche>), réécrite à chaque CI verte d'un push : elle ne déclenche aucun workflow.
  # Une CI rouge ne marque rien — le site reste sur son dernier commit vert.
  marquer-vert:
    name: Marquer le commit vert
    needs: garde-fous
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: refs/ci/verte/${{ github.ref_name }} → ${{ github.sha }}
        run: git push origin "+${GITHUB_SHA}:refs/ci/verte/${GITHUB_REF_NAME}"

  # Tableau de bord des garde-fous (backlog CI/CD, 10/10/2026) — INDICATIF, jamais bloquant.
  # Le job « Garde-fous » s'arrête au premier rouge et ne dit pas où part le temps ; celui-ci lance chaque
  # garde-fou du pre-commit un par un et affiche nom · durée · statut dans le résumé du run. Ici plutôt que
  # dans smoke.yml : il a besoin de tourner à CHAQUE push pour qu'on voie un garde-fou ralentir, et le smoke
  # n'est lancé qu'à la main. Job parallèle (pas de needs) : il n'allonge pas la CI ; continue-on-error et
  # absent des needs de « Marquer le commit vert » : il ne peut ni rougir la CI ni retenir un déploiement.
  tableau-garde-fous:
    name: Tableau de bord des garde-fous (indicatif)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Durée et résultat de chaque garde-fou
        run: node scripts/garde-fous-tableau.js | tee -a "$GITHUB_STEP_SUMMARY"
