# =====================================================================
# MyKTAMap — Config Nginx pour image Docker self-host (v1.36.0)
# =====================================================================
# Sert MyKTAMap en HTTPS sur 8443 avec cert TLS auto-signé.
# Le HTTP sur 8080 redirige automatiquement vers HTTPS.
#
# CSP stricte reprise de docs/nginx-csp-config.conf (cohérence prod).
#
# Différences avec la config prod :
#   - Ports non-privilégiés (8080/8443) pour pas nécessiter root host
#   - HTTPS auto-signé (vs Let's Encrypt en prod)
#   - Pas de HSTS (cert auto-signé → ne pas forcer HTTPS au-delà de 1 session)
#   - Pas de IP-binding (écoute toutes les interfaces du conteneur)
# =====================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs au format combined sur stdout/stderr (visibles via `docker logs`)
    log_format combined_compact '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout combined_compact;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;  # cache la version Nginx (réduit la surface de fingerprint)

    # Gzip pour les assets texte (JS/CSS/HTML/SVG/JSON)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;
    gzip_min_length 1024;

    # MIME pour la PWA (manifest + Service Worker)
    types {
        application/manifest+json    webmanifest;
    }

    # -----------------------------------------------------------------
    # Server HTTP (port 8080) — redirige vers HTTPS
    # -----------------------------------------------------------------
    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        # Toute requête HTTP est redirigée 301 vers HTTPS (même chemin)
        return 301 https://$host:8443$request_uri;
    }

    # -----------------------------------------------------------------
    # Server HTTPS (port 8443) — l'app
    # -----------------------------------------------------------------
    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        http2 on;
        server_name _;

        # Cert TLS (généré par entrypoint.sh ou fournit via volume)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # TLS 1.2 + 1.3 uniquement (compat moderne)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Racine = assets statiques copiés depuis le repo
        root /usr/share/nginx/html;
        index index.html;

        # Pas de listing de répertoire (sécurité)
        autoindex off;

        # ------ En-têtes de sécurité ------
        # CSP stricte — repris de docs/nginx-csp-config.conf (prod).
        # Adapté Docker self-host : pas de external CDN (tout 'self').
        # 🔒 10/10/2026 — BASCULE : scripts depuis l'origine SEULEMENT (plus de 'unsafe-inline'). L'app n'a plus
        # aucun script inline (garde-fou check-csp-inline) ; seul killsw.html garde son exception (bloc dédié).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self' blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;


        # Anti MIME-sniffing, anti-clickjacking, referrer minimal
        # Referrer : comme la prod (docs/nginx-csp-config.conf). Vers un autre site,
        # le navigateur n'envoie que l'ORIGINE (jamais le chemin de la page). 🩸 Pas
        # « no-referrer » : la politique d'usage des tuiles OpenStreetMap exige un
        # Referer valide — sans lui, OSM renvoie la tuile « Access blocked » (mesuré
        # le 04/10/2026 : sans Referer → tuile de blocage, avec → vraie tuile).
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Permissions-Policy : désactive APIs sensibles non utilisées par l'app
        # (la commande vocale utilise microphone, donc on l'autorise 'self')
        # (Vue OSM v1.40.18+ bouton 📍 Ma position utilise Geolocation, autorisée 'self')
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(self), payment=(), usb=()" always;

        # PAS de HSTS — cert auto-signé : on ne veut pas forcer HTTPS persistant
        # côté navigateur user, qui empêcherait un futur switch éventuel.

        # ------ Cache ------
        # Assets versionnés via le SW (CACHE_NAME bump à chaque release) :
        # on peut cacher agressif côté navigateur, le SW gère l'invalidation.
        location ~* \.(?:js|css|woff2|svg|png|jpe?g|gif|webp|ico)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }

        # version.json doit toujours être frais (poll update checker)
        location = /version.json {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # Service Worker : jamais cacher (sinon l'update bloque)
        location = /sw.js {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # killsw.html : page de secours quand le Service Worker est cassé — son script reste DANS la page (un fichier
        # js/ passerait par ce SW). Page fixe, sans donnée utilisateur : elle garde 'unsafe-inline' même après la bascule.
        # (Un location avec add_header n'hérite pas de ceux du serveur : tous les en-têtes sont redits ici.)
        location = /killsw.html {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self' blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Cache-Control "no-store" always;
        }

        # ------ Fallback SPA ------
        # La PWA n'a qu'une seule page (index.html). Tout chemin inconnu
        # → 404 (on ne fait pas de rewrite vers index pour éviter de
        # masquer les fichiers absents légitimes).
        location / {
            try_files $uri $uri/ =404;
        }

        # Refuse les fichiers cachés et fichiers d'infra
        location ~ /\.(ht|git|claude|docker) {
            deny all;
            return 404;
        }
    }
}
