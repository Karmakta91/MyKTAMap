# =====================================================================
# MyKTAMap — Template Nginx PRÊT À L'EMPLOI pour auto-hébergement
# =====================================================================
#
# Édition communautaire (PWA statique, 100 % offline-first).
# Doc complète d'installation : docs/INSTALLATION_SELFHOST.md
#
# Cette conf intègre les bonnes pratiques de la prod myktamap.fr
# (session SSL cache, OCSP stapling, ciphers TLS 1.3 modernes, HSTS
# 1 an + preload) + les spécificités MyKTAMap (SW + JSON live no-cache).
#
# ─── CARTE DE LECTURE ────────────────────────────────────────────────
#
#   ✅ OBLIGATOIRE → sans ça, MyKTAMap ne marche pas correctement
#                     (installation PWA impossible, updates pas
#                      détectées, alertes pas reçues, etc.)
#
#   ⚙️ RECOMMANDÉ  → l'app marche, mais vous perdez de la sécurité,
#                     de la perf, ou des fonctionnalités secondaires
#                     (widget batterie, HSTS, OCSP, etc.)
#
#   💡 OPTIONNEL   → pure amélioration ou conditionnel à votre
#                     contexte (intranet, licence pro, etc.).
#                     Peut être retiré sans incidence.
#
# Si vous démarrez vite, lisez d'abord les blocs ✅, ajoutez ⚙️ ensuite.
#
# ─── COMMENT UTILISER CE TEMPLATE ────────────────────────────────────
#
# 1. Pré-requis (à faire une fois) : générer dhparams2048.pem
#      sudo openssl dhparam -out /etc/ssl/dhparams2048.pem 2048
#    (Si vous skippez : retirez la ligne `ssl_dhparam` plus bas.
#     L'app marchera, perte = sécu DH ECDHE pas renforcée.)
#
# 2. Copier ce fichier :
#      sudo cp docs/nginx-myktamap.conf /etc/nginx/sites-available/myktamap.conf
#
# 3. Éditer pour remplacer les ⚠️ PLACEHOLDERS (cherchez "MKTM_TODO") :
#      sudo grep MKTM_TODO /etc/nginx/sites-available/myktamap.conf
#
# 4. Choisir le bloc certificat (Let's Encrypt OU auto-signé local) :
#      → commenter celui que vous N'utilisez PAS.
#
# 5. Activer (Debian/Ubuntu) :
#      sudo ln -s /etc/nginx/sites-available/myktamap.conf \
#                 /etc/nginx/sites-enabled/
#    OU (Rocky/RHEL) :
#      sudo cp /etc/nginx/sites-available/myktamap.conf /etc/nginx/conf.d/
#
# 6. Tester + reload :
#      sudo nginx -t && sudo systemctl reload nginx
#
# =====================================================================


# ─────────────────────────────────────────────────────────────────────
# 1) Redirection HTTP → HTTPS                              [⚙️ RECOMMANDÉ]
# ─────────────────────────────────────────────────────────────────────
# Sans ce bloc, l'app fonctionne quand même si l'utilisateur tape
# https:// à la main. Avec ce bloc, vous évitez juste les erreurs
# « cette page n'est pas sécurisée » quand quelqu'un tape http://.
# 💡 OPTIONNEL pour une instance intranet où tout le monde a un
#    raccourci https://...

server {
    listen      80;
    listen      [::]:80;

    # ⚠️ MKTM_TODO : remplacer par votre nom DNS
    server_name myktamap.example.com;

    # ACME challenge Let's Encrypt (à laisser même si Option B = sans effet)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ─────────────────────────────────────────────────────────────────────
# 2) Serveur principal HTTPS
# ─────────────────────────────────────────────────────────────────────

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;

    # ✅ server_name : OBLIGATOIRE — sinon Nginx ne sait pas quel vhost servir
    # ⚠️ MKTM_TODO : adapter au nom DNS canonique
    server_name myktamap.example.com;

    # ✅ root + index : OBLIGATOIRE
    # ⚠️ MKTM_TODO : adapter au chemin où vous avez déposé l'app
    root  /var/www/myktamap;
    index index.html;

    # 💡 OPTIONNEL — Force le canonique (utile si plusieurs aliases pointent
    #    ici, p.ex. www.myktamap.fr → myktamap.fr). Inutile si vous n'avez
    #    qu'un seul nom DNS.
    # ⚠️ MKTM_TODO : adapter le nom canonique
    if ($host != "myktamap.example.com") {
        return 301 https://myktamap.example.com$request_uri;
    }

    # 💡 OPTIONNEL — defaults Nginx généralement OK, mais explicite = mieux
    charset utf-8;
    client_max_body_size 100M;  # 💡 OPTIONNEL — aucun upload côté MyKTAMap, le défaut 1M suffit
    autoindex off;              # ⚙️ RECOMMANDÉ — cacher l'arborescence si quelqu'un tape /data/

    # ─────────────────────────────────────────────────────────────────
    # CERTIFICAT TLS — choisir UN des 2 blocs ci-dessous   [✅ OBLIGATOIRE]
    # ─────────────────────────────────────────────────────────────────
    # HTTPS est OBLIGATOIRE pour la PWA (Service Worker + install écran
    # d'accueil refusés en HTTP sauf localhost). Sans TLS, c'est juste
    # un site web classique, MyKTAMap perd 80 % de son intérêt.

    # ─── OPTION A : Let's Encrypt (Internet) ─────────────────────────
    # Décommenter ce bloc si vous utilisez certbot.
    # ⚠️ MKTM_TODO : remplacer par votre domaine
    #
    # ssl_certificate         /etc/letsencrypt/live/myktamap.example.com/fullchain.pem;
    # ssl_certificate_key     /etc/letsencrypt/live/myktamap.example.com/privkey.pem;
    # ssl_trusted_certificate /etc/letsencrypt/live/myktamap.example.com/chain.pem;

    # ─── OPTION B : certificat auto-signé local (intranet) ───────────
    # Décommenter ce bloc si vous avez généré un cert via openssl.
    # Voir docs/INSTALLATION_SELFHOST.md §3.2 pour la procédure.
    # NOTE : pas d'OCSP stapling possible avec une CA auto-signée.

    ssl_certificate     /etc/ssl/myktamap-local/server.crt;
    ssl_certificate_key /etc/ssl/myktamap-local/server.key;

    # ─── Paramètres TLS communs ──────────────────────────────────────
    # ⚙️ RECOMMANDÉ — perf handshake (session cache + tickets)
    ssl_session_cache    shared:SSL:40m;
    ssl_session_timeout  4h;
    ssl_session_tickets  on;
    # 💡 OPTIONNEL — renforce DH pour ECDHE. Si vous skippez, retirez
    #    cette ligne. À générer une fois : openssl dhparam -out ... 2048
    ssl_dhparam          /etc/ssl/dhparams2048.pem;
    # ✅ OBLIGATOIRE — sans ça, defaults Nginx parfois vieillots (TLS 1.0/1.1)
    ssl_protocols        TLSv1.2 TLSv1.3;
    # ⚙️ RECOMMANDÉ — liste explicite, defaults Nginx récents acceptables
    ssl_ciphers          'TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # ─── OCSP stapling (uniquement utile pour Let's Encrypt) ─────────
    # ⚙️ RECOMMANDÉ avec Option A — perf handshake + privacy (évite que
    #    le client appelle le serveur OCSP de la CA).
    # 💡 OPTIONNEL — impossible avec Option B (CA auto-signée).
    # Décommenter avec Option A — commenter avec Option B.
    #
    # ssl_stapling         on;
    # ssl_stapling_verify  on;
    # resolver             1.1.1.1 1.0.0.1 valid=300s;
    # resolver_timeout     30s;

    # ─────────────────────────────────────────────────────────────────
    # HEADERS DE SÉCURITÉ (CSP + bonus)                  [⚙️ RECOMMANDÉ]
    # ─────────────────────────────────────────────────────────────────
    # Inclut la conf CSP commentée et auditée du repo.
    # ✅ La CSP elle-même est CRITIQUE pour la promesse anti-exfiltration
    #    (cf. docs/NETWORK_AUDIT.md). Si vous skippez cet include, vous
    #    perdez la double-protection (le module js/networkAudit.js reste
    #    actif, mais sans backstop navigateur).
    # ⚙️ Permissions-Policy avec battery=(self) → nécessaire pour le
    #    widget batterie et les warnings 20/10/5%. L'app marche sans,
    #    mais l'icône batterie disparaît silencieusement.
    # ⚠️ MKTM_TODO : adapter le chemin si /var/www/myktamap est ailleurs.
    include /var/www/myktamap/docs/nginx-csp-config.conf;

    # ─────────────────────────────────────────────────────────────────
    # SERVICE WORKER — JAMAIS DE CACHE                   [✅ OBLIGATOIRE]
    # ─────────────────────────────────────────────────────────────────
    # Sans no-cache sur /sw.js, l'app ne détecte plus jamais les
    # nouvelles versions (le SW reste figé sur la première version vue).
    # C'est le seul bloc qu'il faut absolument avoir.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        # Permet au SW de contrôler tout le scope racine
        add_header Service-Worker-Allowed "/" always;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────
    # FICHIERS DE CONFIGURATION "LIVE" — NO-CACHE       [✅ OBLIGATOIRE
    # ─────────────────────────────────────────────────────────────────  pour version+alert]
    # version.json     : ✅ détection de mise à jour (UpdateChecker).
    #                       Sans no-cache, le bouton « 🔄 Force update »
    #                       ne marche pas correctement.
    # alert.json       : ✅ alertes publiques (incendie, fermeture, ...).
    #                       Sans no-cache, les nouvelles alertes ne
    #                       remontent pas chez les utilisateurs.
    # Licence-pro.json : 💡 OPTIONNEL — uniquement si vous déployez
    #                       une instance pour un client avec licence
    #                       commerciale. Sinon retirez-le du pattern.
    #
    # ⚠️ DOIT être placé AVANT le bloc générique \.json$ (1er match
    #    regex gagne dans l'ordre du fichier).
    location ~* ^/(version|alert|Licence-pro)\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────
    # PING SANTÉ SERVEUR (depuis v1.9.3) — NO-CACHE     [⚙️ RECOMMANDÉ]
    # ─────────────────────────────────────────────────────────────────
    # Utilisé par l'app pour tester la connectivité avant Force update
    # ou Reset (« es-tu sûr ? tu es hors-ligne »). Sans no-cache, le
    # check ment et un utilisateur offline peut perdre tout son cache.
    # 💡 Si vous skippez : le check se contente de navigator.onLine
    #    (moins fiable, mais ça marche).
    location = /ping.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────
    # PLANS UTILISATEUR (data/...) — CACHE COURT (1h)   [⚙️ RECOMMANDÉ]
    # ─────────────────────────────────────────────────────────────────
    # Vous mettez à jour vos plans sans bumper le SW → cache court pour
    # que les utilisateurs voient les nouveautés rapidement.
    # 💡 Si vous skippez : ça marchera quand même (le pattern \.png/.json
    #    plus bas matchera et cachera 30j → vos modifs de plans mettront
    #    1 mois à se propager côté users qui ont déjà vu l'ancien).
    location ^~ /data/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ─────────────────────────────────────────────────────────────────
    # ASSETS STATIQUES — CACHE LONG (30j)               [⚙️ RECOMMANDÉ]
    # ─────────────────────────────────────────────────────────────────
    # Le Service Worker gère son propre cache versionné via CACHE_NAME.
    # Côté HTTP, on peut cacher long : si le SW change de version, il
    # re-fetch tout avec cache: "reload".
    # 💡 Si vous skippez ce bloc : ça marchera quand même, le SW gère
    #    son propre cache. Vous perdez juste la perf HTTP-level (les
    #    revisits hors-SW devront re-télécharger).
    location ~* \.(json|png|jpg|jpeg|gif|webp|svg|js|css|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────
    # FALLBACK — index.html (préserve les query strings) [✅ OBLIGATOIRE]
    # ─────────────────────────────────────────────────────────────────
    # Sans ce fallback, certaines URLs renvoient 404 (deeplinks).
    location / {
        try_files $uri $uri/ /index.html?$args;
    }

    # ─────────────────────────────────────────────────────────────────
    # GZIP (compression à la volée)                      [⚙️ RECOMMANDÉ]
    # ─────────────────────────────────────────────────────────────────
    # 💡 OPTIONNEL si déjà activé globalement dans /etc/nginx/nginx.conf.
    #    Sinon, l'app marche, vous perdez juste ~70 % de bande passante
    #    sur les fichiers texte (HTML/CSS/JS/JSON).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/manifest+json
                      application/xml
                      application/xml+rss
                      image/svg+xml;

    # ─────────────────────────────────────────────────────────────────
    # LOGS                                                [⚙️ RECOMMANDÉ]
    # ─────────────────────────────────────────────────────────────────
    # 💡 OPTIONNEL — Nginx logue déjà dans /var/log/nginx/access.log
    #    par défaut. Le sous-dossier dédié facilite juste le debug
    #    quand vous avez plusieurs vhosts.
    # ⚠️ MKTM_TODO : créer le dossier si besoin :
    #     sudo mkdir -p /var/log/nginx/myktamap
    access_log /var/log/nginx/myktamap/access.log;
    error_log  /var/log/nginx/myktamap/error.log warn;

    # ─────────────────────────────────────────────────────────────────
    # RESTRICTIONS RÉSEAU                                [💡 OPTIONNEL]
    # ─────────────────────────────────────────────────────────────────
    # Uniquement pour usage intranet. À ne PAS activer pour une
    # instance publique sur Internet (sinon personne ne peut accéder).
    # ⚠️ MKTM_TODO : adapter aux ranges de votre réseau
    #
    # allow 192.168.1.0/24;   # LAN local
    # allow 10.42.0.0/16;     # VPN équipe
    # deny  all;
}


# =====================================================================
# NOTES POST-INSTALL
# =====================================================================
#
# • Test :
#     sudo nginx -t
#
# • Reload (sans interruption de service) :
#     sudo systemctl reload nginx
#
# • Vérifier qu'il écoute :
#     sudo ss -tlnp | grep -E ':(80|443)'
#
# • Vérifier les headers critiques :
#     curl -sI https://myktamap.example.com/sw.js          | grep -i cache-control
#     curl -sI https://myktamap.example.com/version.json   | grep -i cache-control
#     curl -sI https://myktamap.example.com/alert.json     | grep -i cache-control
#     curl -sI https://myktamap.example.com/ping.html      | grep -i cache-control
#       → tous doivent dire "no-cache, no-store, must-revalidate"
#
#     curl -sI https://myktamap.example.com/js/main.js     | grep -i -E 'cache|expires'
#       → max-age=2592000 + expires +30d
#
#     curl -sI https://myktamap.example.com/ | grep -i content-security-policy
#       → doit contenir connect-src 'self' blob:
#
# • Tester la PWA :
#     Ouvrir l'URL dans Chrome → F12 → onglet Lighthouse → catégorie PWA.
#     Le score doit être ≥ 90.
#
# • OCSP stapling (Option A uniquement) :
#     echo | openssl s_client -connect myktamap.example.com:443 -status -servername myktamap.example.com 2>&1 | grep -i "OCSP response"
#       → doit indiquer "OCSP Response Status: successful"
#
# • HSTS activé par défaut dans cette conf (cf. docs/nginx-csp-config.conf
#   ligne Strict-Transport-Security). Si vous n'êtes PAS encore prêt
#   à vous engager sur HTTPS long terme, commentez cette ligne dans la
#   conf CSP — sinon les utilisateurs sont bloqués jusqu'à expiration
#   du cache HSTS (1 an si le preload est actif).
#
# • Si le mode hors-ligne strict de l'app bloque tout : c'est un
#   opt-in user (⚙️ Configuration loader → 🔒 Mode hors-ligne strict),
#   pas une config serveur. Désactivable côté navigateur uniquement.
#
# =====================================================================
