# =====================================================================
# MyKTAMap — Template Nginx PRÊT À L'EMPLOI pour auto-hébergement
# =====================================================================
#
# Édition communautaire (PWA statique, 100 % offline-first).
# Doc complète d'installation : docs/INSTALLATION_SELFHOST.md
#
# COMMENT UTILISER CE TEMPLATE :
#
# 1. Copier ce fichier :
#      sudo cp docs/nginx-myktamap.conf /etc/nginx/sites-available/myktamap.conf
#
# 2. Éditer pour remplacer les ⚠️ PLACEHOLDERS (cherchez "MKTM_TODO") :
#      sudo nano /etc/nginx/sites-available/myktamap.conf
#      → grep "MKTM_TODO" pour les lister tous d'un coup.
#
# 3. Choisir le bloc certificat (Let's Encrypt OU auto-signé local) :
#      → commenter celui que vous N'utilisez PAS.
#
# 4. Activer (Debian/Ubuntu) :
#      sudo ln -s /etc/nginx/sites-available/myktamap.conf \
#                 /etc/nginx/sites-enabled/
#    OU (Rocky/RHEL) :
#      sudo cp /etc/nginx/sites-available/myktamap.conf /etc/nginx/conf.d/
#
# 5. Tester + reload :
#      sudo nginx -t && sudo systemctl reload nginx
#
# =====================================================================


# ─────────────────────────────────────────────────────────────────────
# 1) Redirection HTTP → HTTPS
# ─────────────────────────────────────────────────────────────────────
# Si Let's Encrypt a tourné avec --redirect, ce bloc a peut-être déjà
# été ajouté ailleurs. Si oui, commenter ici pour éviter le doublon.

server {
    listen      80;
    listen      [::]:80;

    # ⚠️ MKTM_TODO : remplacer par votre nom DNS
    # Public  : myktamap.votre-domaine.fr
    # Intranet: myktamap.local secours.intranet
    server_name myktamap.example.com;

    # ACME challenge Let's Encrypt — laisser même si Option B (juste sans effet)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ─────────────────────────────────────────────────────────────────────
# 2) Serveur principal HTTPS
# ─────────────────────────────────────────────────────────────────────

server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;

    # ⚠️ MKTM_TODO : même valeur qu'au-dessus
    server_name myktamap.example.com;

    # ─────────────────────────────────────────────────────────────────
    # CERTIFICAT TLS — choisir UN des 2 blocs ci-dessous
    # ─────────────────────────────────────────────────────────────────

    # ─── OPTION A : Let's Encrypt (Internet) ─────────────────────────
    # Décommenter ce bloc si vous utilisez certbot.
    #
    # ⚠️ MKTM_TODO : remplacer par votre domaine
    #
    # ssl_certificate     /etc/letsencrypt/live/myktamap.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/myktamap.example.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ─── OPTION B : certificat auto-signé local (intranet) ───────────
    # Décommenter ce bloc si vous avez généré un cert via openssl.
    # Voir docs/INSTALLATION_SELFHOST.md §3.2 pour la procédure.

    ssl_certificate     /etc/ssl/myktamap-local/server.crt;
    ssl_certificate_key /etc/ssl/myktamap-local/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ─────────────────────────────────────────────────────────────────
    # RACINE DE L'APP
    # ─────────────────────────────────────────────────────────────────

    # ⚠️ MKTM_TODO : adapter si vous avez déposé l'app ailleurs
    root  /var/www/myktamap;
    index index.html;

    # Encodage par défaut
    charset utf-8;

    # Limites de taille (utiles si vous activez un endpoint d'upload futur)
    client_max_body_size 50M;

    # ─────────────────────────────────────────────────────────────────
    # HEADERS DE SÉCURITÉ (CSP + bonus)
    # ─────────────────────────────────────────────────────────────────
    # Inclut la conf CSP commentée et auditée du repo.
    # ⚠️ MKTM_TODO : ajuster le chemin si votre /var/www/myktamap est ailleurs.
    include /var/www/myktamap/docs/nginx-csp-config.conf;

    # ─────────────────────────────────────────────────────────────────
    # SERVICE WORKER — NE JAMAIS CACHER
    # ─────────────────────────────────────────────────────────────────
    # Si on cache /sw.js, l'app ne détecte plus jamais les nouvelles
    # versions (le SW reste figé). Cf. release notes UpdateChecker.

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;

        # Sécurité : empêcher tout autre site d'utiliser ce SW
        add_header Service-Worker-Allowed "/" always;

        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────
    # FICHIERS DE CONFIGURATION "LIVE" — JAMAIS DE CACHE NON PLUS
    # ─────────────────────────────────────────────────────────────────
    # version.json     : détection de mise à jour
    # alert.json       : alertes publiques (incendie, fermeture, ...)
    # Licence-pro.json : détection édition pro (optionnel, voir doc pro)

    location ~* ^/(version|alert|Licence-pro)\.json$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache" always;
        add_header Expires       "0" always;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────
    # ASSETS STATIQUES — CACHE LONG
    # ─────────────────────────────────────────────────────────────────
    # Le Service Worker gère son propre cache versionné via CACHE_NAME.
    # Côté HTTP, on peut donc cacher long les assets : si le SW change
    # de version, il re-fetch tout avec cache: "reload".

    location ~* \.(css|js|png|jpg|jpeg|webp|gif|svg|ico|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────────
    # PLANS UTILISATEUR (data/...) — CACHE COURT
    # ─────────────────────────────────────────────────────────────────
    # Vous mettez à jour vos plans sans bumper le SW → cache court pour
    # que les utilisateurs voient les nouveautés rapidement.

    location ^~ /data/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ─────────────────────────────────────────────────────────────────
    # FALLBACK — index.html
    # ─────────────────────────────────────────────────────────────────

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─────────────────────────────────────────────────────────────────
    # GZIP (compression à la volée)
    # ─────────────────────────────────────────────────────────────────

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain
                      text/css
                      text/javascript
                      application/javascript
                      application/json
                      application/manifest+json
                      application/xml
                      application/xml+rss
                      image/svg+xml;

    # ─────────────────────────────────────────────────────────────────
    # LOGS
    # ─────────────────────────────────────────────────────────────────

    access_log /var/log/nginx/myktamap-access.log;
    error_log  /var/log/nginx/myktamap-error.log warn;

    # ─────────────────────────────────────────────────────────────────
    # RESTRICTIONS RÉSEAU — OPTIONNEL (uniquement intranet)
    # ─────────────────────────────────────────────────────────────────
    # Décommenter + adapter pour limiter l'accès à un réseau précis.
    #
    # ⚠️ MKTM_TODO : adapter aux ranges de votre réseau
    #
    # allow 192.168.1.0/24;   # LAN local
    # allow 10.42.0.0/16;     # VPN équipe
    # deny  all;
}


# =====================================================================
# NOTES POST-INSTALL
# =====================================================================
#
# • Test :
#     sudo nginx -t
#
# • Reload (sans interruption de service) :
#     sudo systemctl reload nginx
#
# • Vérifier qu'il écoute :
#     sudo ss -tlnp | grep -E ':(80|443)'
#
# • Vérifier les headers servis :
#     curl -I https://myktamap.example.com/
#       → doit contenir Content-Security-Policy, X-Frame-Options, ...
#     curl -I https://myktamap.example.com/sw.js
#       → doit contenir Cache-Control: no-cache, no-store, must-revalidate
#
# • Tester la PWA :
#     Ouvrir l'URL dans Chrome → F12 → onglet Lighthouse → catégorie PWA.
#     Le score doit être ≥ 90.
#
# • Pour activer HSTS (force HTTPS pendant 6 mois sur le navigateur) :
#     décommenter la ligne Strict-Transport-Security dans
#     docs/nginx-csp-config.conf
#
#     ⚠️ À ne faire QUE quand vous êtes 100 % sûr que HTTPS est OK et
#        durable — sinon les utilisateurs sont bloqués jusqu'à expiration
#        du cache HSTS.
#
# • Si le mode hors-ligne strict de l'app bloque tout : c'est un
#   opt-in user (⚙️ Configuration loader → 🔒 Mode hors-ligne strict),
#   pas une config serveur. Désactivable côté navigateur uniquement.
#
# =====================================================================
