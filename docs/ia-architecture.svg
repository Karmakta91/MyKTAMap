<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1210" width="1200" height="1210" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Architecture de l'IA de code : ce qui est chargé, d'où, et quand</title>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f4c542"/>
    </marker>
    <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8cb4ff"/>
    </marker>
    <marker id="fv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fd9a8"/>
    </marker>
    <style>
      .t { fill: #e8eaf0; font-size: 15px; }
      .m { fill: #c8d0e0; font-size: 13.5px; }
      .p { fill: #8892a4; font-size: 12.5px; }
      .h { fill: #f4c542; font-size: 18px; font-weight: 700; }
      .k { fill: #8cb4ff; font-size: 14px; font-weight: 700; }
      .c { font-family: Consolas, Menlo, monospace; }
      .bo { fill: #141927; stroke: #2e3650; stroke-width: 2; }
      .it { fill: #1c2233; stroke: #39425e; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="1210" rx="18" fill="#0d111c"/>

  <text x="600" y="40" text-anchor="middle" fill="#e8eaf0" font-size="24" font-weight="700">Comment l'IA sait ce qu'elle sait</text>
  <text x="600" y="64" text-anchor="middle" class="m">Trois endroits sur le disque, quatre moments dans une session</text>

  <!-- ═══ POSTE ═══ -->
  <rect x="20" y="86" width="360" height="560" rx="16" class="bo"/>
  <text x="40" y="116" class="h">🖥️ Le poste (hors dépôts)</text>
  <text x="40" y="136" class="p c">~/.claude/</text>

  <rect x="36" y="150" width="328" height="96" rx="10" class="it"/>
  <text x="50" y="174" class="t">CLAUDE.md du poste</text>
  <text x="50" y="194" class="m">Quelques lignes : il importe la carte</text>
  <text x="50" y="212" class="m">de l'écosystème (quel dépôt sert à quoi)</text>
  <text x="50" y="232" class="p">chargé dans TOUTE session</text>

  <rect x="36" y="258" width="328" height="118" rx="10" class="it"/>
  <text x="50" y="282" class="t">Mémoire de l'IA (par projet)</text>
  <text x="50" y="302" class="m">Index : une ligne par souvenir → chargé</text>
  <text x="50" y="320" class="m">Souvenirs : un fichier chacun → lu si utile</text>
  <text x="50" y="340" class="m">Préférences, décisions datées, pièges</text>
  <text x="50" y="358" class="p">hors outillage : jamais une to-do (§12)</text>

  <rect x="36" y="388" width="328" height="110" rx="10" class="it" stroke-dasharray="6 5"/>
  <text x="50" y="412" class="t">skills/kta-*   ·   agents/</text>
  <text x="50" y="432" class="m">Des JONCTIONS, pas des fichiers :</text>
  <text x="50" y="450" class="m">elles pointent vers le dépôt privé,</text>
  <text x="50" y="468" class="m">donc visibles quel que soit le dépôt ouvert</text>
  <text x="50" y="486" class="p">une source, versionnée ; zéro copie</text>

  <rect x="36" y="510" width="328" height="120" rx="10" class="it"/>
  <text x="50" y="534" class="t">Hors de portée de l'IA</text>
  <text x="50" y="554" class="m">Clé privée des licences, secrets (.env),</text>
  <text x="50" y="572" class="m">sauvegardes, relevés réels</text>
  <text x="50" y="592" class="m">→ lecture refusée par les permissions</text>
  <text x="50" y="612" class="p">(.claude/settings.json de chaque dépôt)</text>

  <!-- ═══ COMMUNITY ═══ -->
  <rect x="420" y="86" width="360" height="560" rx="16" class="bo"/>
  <text x="440" y="116" class="h">🌍 Dépôt public (l'application)</text>
  <text x="440" y="136" class="p">lisible par tous : aucun outillage interne</text>

  <rect x="436" y="150" width="328" height="96" rx="10" class="it"/>
  <text x="450" y="174" class="t">CLAUDE.md</text>
  <text x="450" y="194" class="m">Règles, interdits, conventions, contrat</text>
  <text x="450" y="212" class="m">de communication, table « Où chercher »</text>
  <text x="450" y="232" class="p">chargé si la session est ouverte ici</text>

  <rect x="436" y="258" width="328" height="118" rx="10" class="it"/>
  <text x="450" y="282" class="t">.claude/ (la session)</text>
  <text x="450" y="302" class="m">settings.json : permissions (refus)</text>
  <text x="450" y="320" class="m">hooks/guard-git : AVANT chaque commande</text>
  <text x="450" y="338" class="m">hooks/check-syntax : APRÈS chaque écriture</text>
  <text x="450" y="358" class="p">règles git appliquées à TOUS les dépôts</text>

  <rect x="436" y="388" width="328" height="110" rx="10" class="it"/>
  <text x="450" y="412" class="t">.claude/skills/ (moteur public)</text>
  <text x="450" y="432" class="m">release · add-icon-tag · add-zone-type</text>
  <text x="450" y="450" class="m">utilisables par un contributeur externe</text>
  <text x="450" y="472" class="t">docs/architecture/*.md</text>
  <text x="450" y="490" class="p">l'état actuel, un fichier par sujet</text>

  <rect x="436" y="510" width="328" height="120" rx="10" class="it"/>
  <text x="450" y="534" class="t">Côté Git (pas l'IA)</text>
  <text x="450" y="554" class="m">.githooks : pre-commit, commit-msg</text>
  <text x="450" y="572" class="m">scripts/check-*.js : les garde-fous</text>
  <text x="450" y="592" class="m">CI : rejoue tout à chaque push</text>
  <text x="450" y="612" class="p">ce que l'IA contourne, la CI le revoit</text>

  <!-- ═══ PRO ═══ -->
  <rect x="820" y="86" width="360" height="560" rx="16" class="bo"/>
  <text x="840" y="116" class="h">🔒 Dépôt privé (interne)</text>
  <text x="840" y="136" class="p">jamais exporté chez un client</text>

  <rect x="836" y="150" width="328" height="96" rx="10" class="it"/>
  <text x="850" y="174" class="t">CLAUDE.md</text>
  <text x="850" y="194" class="m">Ce qui lui est propre ; le style et le</text>
  <text x="850" y="212" class="m">contrat du dépôt public valent ici aussi</text>
  <text x="850" y="232" class="p">chargé si la session est ouverte ici</text>

  <rect x="836" y="258" width="328" height="118" rx="10" class="it"/>
  <text x="850" y="282" class="t">docs/ECOSYSTEME.md</text>
  <text x="850" y="302" class="m">La carte : rôle, visibilité, branches et</text>
  <text x="850" y="320" class="m">mise en ligne de chaque dépôt</text>
  <text x="850" y="340" class="m">+ .claude/ : ses permissions et hooks</text>
  <text x="850" y="358" class="p">source UNIQUE, réécrite (pas empilée)</text>

  <rect x="836" y="388" width="328" height="242" rx="10" class="it"/>
  <text x="850" y="412" class="t">.claude/skills/kta-* (outillage interne)</text>
  <text x="850" y="434" class="m c">kta-integrer-branche</text>
  <text x="850" y="452" class="m c">kta-pro-modif-module</text>
  <text x="850" y="470" class="m c">kta-scenario-navigateur</text>
  <text x="850" y="488" class="m c">kta-vps-ops</text>
  <text x="850" y="506" class="m c">kta-story-insta</text>
  <text x="850" y="534" class="t">.claude/agents/</text>
  <text x="850" y="556" class="m c">kta-copie-separee</text>
  <text x="850" y="576" class="m">un lot délégué : copie de travail,</text>
  <text x="850" y="594" class="m">pile de test, preuves, rapport</text>
  <text x="850" y="614" class="p">les règles répétées vivent ICI, une fois</text>

  <!-- liens poste → pro -->
  <path d="M364 198 L400 198 L400 78 L800 78 L800 312 L832 312" fill="none" stroke="#f4c542" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#fl)"/>
  <rect x="520" y="70" width="160" height="16" fill="#0d111c"/>
  <text x="600" y="82" text-anchor="middle" fill="#f4c542" font-size="12.5">import @ (chaque session)</text>
  <path d="M364 443 L400 443 L400 662 L800 662 L800 460 L832 460" fill="none" stroke="#8fd9a8" stroke-width="2.5" stroke-dasharray="3 6" stroke-linejoin="round" marker-end="url(#fv)"/>
  <text x="600" y="680" text-anchor="middle" fill="#8fd9a8" font-size="13">jonctions → skills et agents (lus à la demande)</text>

  <!-- ═══ SESSION ═══ -->
  <rect x="20" y="690" width="1160" height="500" rx="16" class="bo"/>
  <text x="40" y="722" class="h">⏱️ Une session, du premier message au merge</text>

  <!-- 1 -->
  <rect x="36" y="742" width="272" height="250" rx="12" class="it"/>
  <text x="52" y="770" class="k">1 · Au démarrage</text>
  <text x="52" y="792" class="m">Toujours chargé (coûte à</text>
  <text x="52" y="810" class="m">chaque session, donc court) :</text>
  <text x="52" y="834" class="t">• CLAUDE.md du poste</text>
  <text x="66" y="852" class="m">+ carte de l'écosystème</text>
  <text x="52" y="874" class="t">• CLAUDE.md du dépôt OUVERT</text>
  <text x="52" y="896" class="t">• index de la mémoire</text>
  <text x="52" y="918" class="t">• NOM + description des</text>
  <text x="66" y="936" class="t">skills et agents</text>
  <text x="52" y="964" class="p">le contenu d'une skill n'est pas</text>
  <text x="52" y="980" class="p">chargé tant qu'on ne s'en sert pas</text>

  <!-- 2 -->
  <rect x="322" y="742" width="272" height="250" rx="12" class="it"/>
  <text x="338" y="770" class="k">2 · À chaque action</text>
  <text x="338" y="792" class="m">Les garde-fous du dépôt OUVERT :</text>
  <text x="338" y="816" class="t">• permissions : lecture refusée</text>
  <text x="352" y="834" class="m">des secrets et des relevés</text>
  <text x="338" y="856" class="t">• hook AVANT commande :</text>
  <text x="352" y="874" class="m">pas de push main, de force,</text>
  <text x="352" y="892" class="m">d'add -A, de tag</text>
  <text x="338" y="914" class="t">• hook APRÈS écriture :</text>
  <text x="352" y="932" class="m">syntaxe JavaScript</text>
  <text x="338" y="964" class="p">un refus revient dans la conversation :</text>
  <text x="338" y="980" class="p">l'IA le lit et s'adapte</text>

  <!-- 3 -->
  <rect x="608" y="742" width="272" height="250" rx="12" class="it"/>
  <text x="624" y="770" class="k">3 · À la demande</text>
  <text x="624" y="792" class="m">Lu seulement quand le sujet arrive :</text>
  <text x="624" y="816" class="t">• une skill complète</text>
  <text x="638" y="834" class="m">(procédure pas à pas)</text>
  <text x="624" y="856" class="t">• docs/architecture/&lt;sujet&gt;</text>
  <text x="638" y="874" class="m">pointé par « Où chercher »</text>
  <text x="624" y="896" class="t">• un souvenir de la mémoire</text>
  <text x="624" y="918" class="t">• le code lui-même</text>
  <text x="638" y="936" class="m">(seule source qui ne ment pas)</text>
  <text x="624" y="964" class="p">c'est ce découpage qui économise</text>
  <text x="624" y="980" class="p">les tokens (§4.4)</text>

  <!-- 4 -->
  <rect x="894" y="742" width="272" height="250" rx="12" class="it"/>
  <text x="910" y="770" class="k">4 · Déléguer un lot</text>
  <text x="910" y="792" class="m">L'agent kta-copie-separee :</text>
  <text x="910" y="816" class="t">• sa copie de travail</text>
  <text x="924" y="834" class="m">(son CLAUDE.md = sa branche)</text>
  <text x="910" y="856" class="t">• sa pile de test numérotée</text>
  <text x="910" y="878" class="t">• ses preuves, ses commits</text>
  <text x="924" y="896" class="m">jamais de push</text>
  <text x="910" y="918" class="t">• un rapport court</text>
  <text x="910" y="946" class="m">puis la skill d'intégration</text>
  <text x="910" y="964" class="p">revérifie avant de pousser</text>

  <path d="M308 866 L320 866" stroke="#8cb4ff" stroke-width="2.5" marker-end="url(#fb)"/>
  <path d="M594 866 L606 866" stroke="#8cb4ff" stroke-width="2.5" marker-end="url(#fb)"/>
  <path d="M880 866 L892 866" stroke="#8cb4ff" stroke-width="2.5" marker-end="url(#fb)"/>

  <!-- chaîne de livraison -->
  <rect x="36" y="1010" width="1130" height="160" rx="12" fill="#11161f" stroke="#39425e" stroke-width="1.5"/>
  <text x="52" y="1036" class="k">Et après l'IA : ce qui ne dépend plus d'elle</text>
  <g font-size="14">
    <rect x="52" y="1052" width="200" height="56" rx="10" class="it"/>
    <text x="152" y="1076" text-anchor="middle" class="t">commit</text>
    <text x="152" y="1096" text-anchor="middle" class="p">hooks Git (garde-fous)</text>
    <rect x="282" y="1052" width="200" height="56" rx="10" class="it"/>
    <text x="382" y="1076" text-anchor="middle" class="t">push branche de travail</text>
    <text x="382" y="1096" text-anchor="middle" class="p">CI : tout est rejoué</text>
    <rect x="512" y="1052" width="200" height="56" rx="10" class="it"/>
    <text x="612" y="1076" text-anchor="middle" class="t">site de développement</text>
    <text x="612" y="1096" text-anchor="middle" class="p">en ligne si CI verte</text>
    <rect x="742" y="1052" width="200" height="56" rx="10" class="it"/>
    <text x="842" y="1076" text-anchor="middle" class="t">porte de release</text>
    <text x="842" y="1096" text-anchor="middle" class="p">smoke, trempage, revue</text>
    <rect x="972" y="1052" width="180" height="56" rx="10" fill="#2a2410" stroke="#f4c542" stroke-width="2"/>
    <text x="1062" y="1076" text-anchor="middle" fill="#f4c542" font-size="15" font-weight="700">merge main</text>
    <text x="1062" y="1096" text-anchor="middle" class="p">le propriétaire SEUL</text>
  </g>
  <path d="M252 1080 L280 1080" stroke="#8cb4ff" stroke-width="2.5" marker-end="url(#fb)"/>
  <path d="M482 1080 L510 1080" stroke="#8cb4ff" stroke-width="2.5" marker-end="url(#fb)"/>
  <path d="M712 1080 L740 1080" stroke="#8cb4ff" stroke-width="2.5" marker-end="url(#fb)"/>
  <path d="M942 1080 L970 1080" stroke="#8cb4ff" stroke-width="2.5" marker-end="url(#fb)"/>
  <text x="600" y="1140" text-anchor="middle" class="m">L'IA prépare et prouve ; elle ne pousse jamais main, ne tague pas, ne déploie pas, n'écrit aucune dérogation.</text>
  <text x="600" y="1160" text-anchor="middle" class="p">Les hooks de la session sont ceux du dépôt où elle a été OUVERTE ; ceux du dépôt public couvrent aussi les autres dépôts.</text>
</svg>
