  <text class="ts ts-sec" x="340" y="158">myktamap_terms_accepted_v1 · myktamap_unlock_v1 · myktamap_pin_v1</text>
  <line class="arr" x1="340" y1="174" x2="340" y2="190" marker-end="url(#arrow)"/>

