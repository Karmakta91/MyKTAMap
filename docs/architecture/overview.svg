<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="2250" viewBox="0 0 680 1500">
  <title>MyKTAMap — architecture générale</title>
  <desc>Vue d'ensemble v1.63 : entrée, gate, hub Home, écrans accessibles depuis Home, écran plan Leaflet et ses outils, avec modules JS, fonctions d'entrée et clés de stockage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8892a4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .tt  { font: 500 14px 'Segoe UI', Arial, sans-serif; fill: #e8eaf0; }
      .ts  { font: 400 11.5px Consolas, 'Courier New', monospace; fill: #8892a4; }
      .lbl { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #c8d0e0; }
      .hdr { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #f4c542; }
      .box-off  { fill: #222b40; stroke: #45557a; stroke-width: 1; }
      .box-net  { fill: #1e2c4a; stroke: #8cb4ff; stroke-width: 1; }
      .box-sec  { fill: #2e2230; stroke: #e0796b; stroke-width: 1; }
      .box-hub  { fill: #332b16; stroke: #f4c542; stroke-width: 1.2; }
      .box-usr  { fill: #2a3145; stroke: #566179; stroke-width: 1; }
      .cont     { fill: none; stroke: #4a5570; stroke-width: 1; stroke-dasharray: 6 4; }
      .arr      { stroke: #8892a4; stroke-width: 1.5; fill: none; }
      .tt-net { fill: #8cb4ff; } .ts-net { fill: #7d95c4; }
      .tt-sec { fill: #f2b0a5; } .ts-sec { fill: #d59a90; }
      .tt-hub { fill: #f4c542; } .ts-hub { fill: #d8c48f; }
      text { text-anchor: middle; dominant-baseline: central; }
      .left { text-anchor: start; }
    </style>
  </defs>
