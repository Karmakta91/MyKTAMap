# =====================================================================
# MyKTAMap — Redirection myktamap.is-underground.fr → myktamap.fr
# =====================================================================
# But : transition propre du domaine historique vers le nouveau, SANS casser
# les Service Workers déjà installés chez les utilisateurs PWA.
#
# CONTEXTE PWA
# Un SW est lié à son origin (= domaine + protocole + port). Une simple
# redirection 301 laisse :
#   - Le SW de l'ancien domaine toujours actif (jusqu'à désinstallation manuelle)
#   - Les caches (Cache API + IndexedDB + localStorage) sur l'ancien origin
#   - Le manifest installé pointe encore sur l'ancien domaine
#
# Solution : on sert
#   1. Un "kill switch SW" sur /sw.js qui s'auto-désenregistre + purge caches
#   2. Une page HTML de transition pour tout autre path → redirige + nettoyage JS
#
# Le browser revérifie /sw.js auprès du serveur au max toutes les 24h pour les
# PWA installées (et plus souvent sur ouvrir/recharger). Donc à terme tous les
# clients seront migrés sans intervention de l'utilisateur.
#
# DEPLOIEMENT
#   1. Mettre à jour `myktamap.fr` (nouveau domaine) avec la conf normale qui
#      sert l'app (idem qu'avant pour `is-underground.fr`).
#   2. Remplacer la conf de `myktamap.is-underground.fr` par ce qui suit.
#   3. `sudo nginx -t && sudo systemctl reload nginx`
#   4. Conserver l'ancien domaine + ce kill switch pendant 6-12 mois pour
#      laisser le temps à tous les SW de se mettre à jour.
#   5. Plus tard : enlever ce vhost ou pointer le DNS vers du 410 Gone.
#
# Adapter les chemins SSL Let's Encrypt selon ton install OVH.
# =====================================================================

# ---------------------------------------------------------------------
# HTTP → HTTPS (au cas où)
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name myktamap.is-underground.fr;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------
# HTTPS — Vhost de transition
# ---------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name myktamap.is-underground.fr;

    # SSL — adapter au chemin réel des certifs Let's Encrypt OVH
    ssl_certificate     /etc/letsencrypt/live/myktamap.is-underground.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myktamap.is-underground.fr/privkey.pem;

    # Sécurité minimale
    add_header X-Content-Type-Options    "nosniff"    always;
    add_header X-Frame-Options           "DENY"       always;
    add_header Referrer-Policy           "no-referrer" always;

    # =================================================================
    # 1. KILL SWITCH SW — /sw.js
    # =================================================================
    # Ce SW remplace l'ancien au prochain check d'update du browser (≤ 24h
    # pour les PWA installées, immédiat pour les onglets actifs). Une fois
    # activé, il purge tous les caches PWA puis se désenregistre lui-même
    # et force le reload des clients → ils tombent sur la page HTML de
    # transition ci-dessous → cleanup JS final + redirection.
    #
    # IMPORTANT : Cache-Control no-cache no-store sur sw.js pour que le
    # navigateur ne le ressorte JAMAIS d'un cache HTTP intermédiaire.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        add_header Expires       "0"                                   always;
        add_header Service-Worker-Allowed "/"                          always;
        default_type application/javascript;
        return 200 '/*!
 * MyKTAMap — Kill switch SW (transition myktamap.is-underground.fr → myktamap.fr)
 * Ce SW remplace l\'ancien, purge tous les caches et se desenregistre.
 */
self.addEventListener("install", function(e) {
  e.waitUntil(self.skipWaiting());
});

self.addEventListener("activate", function(e) {
  e.waitUntil((async function() {
    // 1. Purge tous les caches PWA (Cache API)
    try {
      const keys = await caches.keys();
      await Promise.all(keys.map(function(k) { return caches.delete(k); }));
    } catch(err) {}

    // 2. Desenregistre soi-meme
    try {
      await self.registration.unregister();
    } catch(err) {}

    // 3. Force tous les clients (onglets, PWA installee) a reload
    //    Ils tomberont sur la page HTML de transition qui finit le menage cote JS
    //    et redirige vers myktamap.fr
    try {
      const clientsList = await self.clients.matchAll({ type: "window", includeUncontrolled: true });
      clientsList.forEach(function(c) { try { c.navigate(c.url); } catch(e) {} });
    } catch(err) {}
  })());
});

// Pendant le temps que ce SW est actif (entre activate et reload effectif),
// on laisse passer tout au reseau (= page HTML de transition) au lieu de
// servir depuis un cache potentiellement obsolete.
self.addEventListener("fetch", function(e) {
  /* no-op : on ne sert plus rien depuis le cache */
});
';
    }

    # =================================================================
    # 2. MANIFEST PWA — /manifest.json
    # =================================================================
    # Sert un manifest "vide" qui force la PWA à se réinstaller sur le nouveau
    # domaine. Pas critique mais évite des bugs visuels si le browser tente de
    # ré-installer la PWA sur l'ancien domaine entre 2 update SW.
    location = /manifest.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        default_type application/json;
        return 200 '{"name":"MyKTAMap (transition)","short_name":"MKM","start_url":"https://myktamap.fr/","display":"browser","background_color":"#1a1f2e","theme_color":"#1a1f2e"}';
    }

    # =================================================================
    # 3. TOUS LES AUTRES PATHS — Page HTML de transition
    # =================================================================
    # Affichée aux users qui ouvrent l'ancien domaine en navigateur normal
    # (= sans SW actif, ou après désinstallation du SW). Fait le ménage JS
    # final + redirige vers myktamap.fr.
    #
    # Le meta refresh + window.location.replace + countdown = triple
    # filet de sécurité au cas où le JS soit bloqué.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma        "no-cache"                            always;
        add_header Expires       "0"                                   always;
        default_type text/html;
        charset utf-8;
        return 200 '<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyKTAMap — Nouvelle adresse</title>
  <meta http-equiv="refresh" content="3;url=https://myktamap.fr/">
  <meta name="robots" content="noindex,follow">
  <link rel="canonical" href="https://myktamap.fr/">
  <style>
    *{box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
         background:linear-gradient(135deg,#0a0d18,#1a1f2e);color:#e8eaf0;
         text-align:center;padding:50px 20px;margin:0;min-height:100vh;
         display:flex;flex-direction:column;justify-content:center;align-items:center}
    h1{color:#f4c542;font-size:28px;margin:0 0 12px}
    p{margin:8px 0;line-height:1.5;max-width:520px}
    a{color:#8cb4ff;text-decoration:none;font-weight:600;font-size:18px}
    a:hover{text-decoration:underline}
    .countdown{font-size:13px;color:#8892a4;margin-top:30px;font-family:monospace}
    .footer{font-size:11px;color:#5a6275;margin-top:50px;max-width:520px;line-height:1.4}
  </style>
</head>
<body>
  <h1>🌐 MyKTAMap a déménagé</h1>
  <p>Nouvelle adresse&nbsp;:</p>
  <p><a href="https://myktamap.fr/" id="newlink">https://myktamap.fr/</a></p>
  <p class="countdown" id="countdown">Redirection dans 3s…</p>
  <p class="footer">L\'application a déménagé sur un nouveau domaine.<br>
     Mets à jour tes favoris et réinstalle la PWA si nécessaire.</p>
  <script>
    (async function() {
      try {
        if ("serviceWorker" in navigator) {
          var regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(function(r) { return r.unregister(); }));
        }
        if ("caches" in window) {
          var keys = await caches.keys();
          await Promise.all(keys.map(function(k) { return caches.delete(k); }));
        }
      } catch(e) {}
      // Petite pause pour laisser le temps au nettoyage avant redirect
      setTimeout(function() { window.location.replace("https://myktamap.fr/"); }, 800);
    })();
    var s = 3;
    var el = document.getElementById("countdown");
    var t = setInterval(function() {
      s--;
      if (el) el.textContent = "Redirection dans " + s + "s…";
      if (s <= 0) {
        clearInterval(t);
        window.location.replace("https://myktamap.fr/");
      }
    }, 1000);
  </script>
</body>
</html>';
    }
}
